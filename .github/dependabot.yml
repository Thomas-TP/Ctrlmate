version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /apps/desktop
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /crates/ctrlmate-lhm-bridge
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tests/ha
    schedule:
      interval: weekly
