name: Release (Velopack Windows & Linux + deb/rpm)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.0)'
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = "${{ github.ref_name }}" -replace '^v',''
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build Desktop Frontend (Bun + Vite)
        run: |
          bun install --cwd apps/desktop
          bun run --cwd apps/desktop build

      - name: Build Rust Release Binaries
        run: cargo build --release -p ctrlmate-daemon -p ctrlmate-desktop

      - name: Build Optional Deep Hardware Bridge (.NET 8)
        run: dotnet build crates/ctrlmate-lhm-bridge/Ctrlmate.LhmBridge.csproj -c Release -r win-x64

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Pack Velopack Windows Installer & Update Feed
        shell: pwsh
        run: .\packaging\windows\pack-velopack.ps1 -Version "${{ steps.ver.outputs.version }}" -OutDir "dist-velopack/win"

      - uses: actions/upload-artifact@v4
        with:
          name: ctrlmate-windows-velopack
          path: dist-velopack/win/*

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev libhidapi-dev pkg-config rpm fuse

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build Desktop Frontend (Bun + Vite)
        run: |
          bun install --cwd apps/desktop
          bun run --cwd apps/desktop build

      - name: Build Rust Release Binaries
        run: cargo build --release -p ctrlmate-daemon -p ctrlmate-desktop

      - name: Install Velopack CLI (vpk)
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack Velopack Linux AppImage + deb + rpm
        run: |
          chmod +x packaging/linux/pack-linux.sh
          ./packaging/linux/pack-linux.sh "${{ steps.ver.outputs.version }}" dist-velopack/linux

      - uses: actions/upload-artifact@v4
        with:
          name: ctrlmate-linux-packages
          path: dist-velopack/linux/*

  publish-release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload All Velopack & Native Packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          FILES=(release-assets/**/*.*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Ctrlmate $GITHUB_REF_NAME" \
              --generate-notes
          fi
