name: Release

# Tag a release with:  git tag vX.Y.Z && git push origin vX.Y.Z
# The tag MUST equal [workspace.package].version (checked below). workflow_dispatch builds everything
# as a dry run and uploads workflow artifacts, but never publishes a GitHub Release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BUN_VERSION: "1.4.4"
  DOTNET_VERSION: "10.0.x"
  PYTHON_VERSION: "3.13"
  VPK_VERSION: "1.2.161" # same major.minor as the `velopack` crate in Cargo.lock
  REPO_URL: https://github.com/Thomas-TP/Ctrlmate

jobs:
  gate:
    name: Quality gate (CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Verify tag and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: v
        name: Tag equals workspace version; everything in sync; notes exist
        run: |
          ws="$(python scripts/sync_version.py --print)"
          echo "version=$ws" >> "$GITHUB_OUTPUT"
          case "$ws" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${ws}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version v${ws}"; exit 1
          fi
          python scripts/sync_version.py --check
          python scripts/extract_changelog.py "$ws" > release-notes.md
          if grep -q "SKIP" packaging/linux/PKGBUILD && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::warning::PKGBUILD still has sha256sums=('SKIP'); run updpkgsums after publishing the tag archive."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  frontend:
    name: Front end
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/desktop/dist
          if-no-files-found: error

  windows:
    name: Windows x64 (Velopack)
    needs: [prepare, frontend, gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release-win
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - name: Build Rust binaries
        run: cargo build --release --locked -p ctrlmate-daemon -p ctrlmate-agent -p ctrlmate-desktop
      - name: Build deep-hardware bridge
        run: dotnet publish crates/ctrlmate-lhm-bridge/Ctrlmate.LhmBridge.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ needs.prepare.outputs.version }}
      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # --- Authenticode (optional) --------------------------------------------------------
      # Option A, Azure Trusted Signing via OIDC: set repository variables AZURE_CLIENT_ID,
      #   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT, AZURE_TS_PROFILE.
      # Option B, PFX: set secrets WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD.
      # With neither, packaging continues UNSIGNED and pack-velopack.ps1 prints a visible warning.
      - name: Detect signing configuration
        id: sign
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TS_ENDPOINT: ${{ vars.AZURE_TS_ENDPOINT }}
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TS_ENDPOINT" ]; then echo "mode=azure" >> "$GITHUB_OUTPUT"
          elif [ -n "$PFX" ]; then echo "mode=pfx" >> "$GITHUB_OUTPUT"
          else echo "mode=none" >> "$GITHUB_OUTPUT"; fi
      - name: Azure login (OIDC)
        if: steps.sign.outputs.mode == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare signing inputs
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          switch ("${{ steps.sign.outputs.mode }}") {
            "azure" {
              $meta = @{ Endpoint = "${{ vars.AZURE_TS_ENDPOINT }}"; CodeSigningAccountName = "${{ vars.AZURE_TS_ACCOUNT }}"; CertificateProfileName = "${{ vars.AZURE_TS_PROFILE }}" } | ConvertTo-Json
              $path = Join-Path $env:RUNNER_TEMP "azure-signing.json"
              [IO.File]::WriteAllText($path, $meta)
              "CTRLMATE_AZURE_SIGN_FILE=$path" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
            "pfx" {
              $path = Join-Path $env:RUNNER_TEMP "codesign.pfx"
              [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
              "::add-mask::$env:PFX_PASSWORD"
              "CTRLMATE_SIGN_PARAMS=/f `"$path`" /p `"$env:PFX_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }

      - name: Pack (with delta from the previous release)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ./packaging/windows/pack-velopack.ps1
          -Version "${{ needs.prepare.outputs.version }}"
          -RepoUrl "${{ env.REPO_URL }}"
          -DownloadPrevious
          ${{ needs.prepare.outputs.prerelease == 'true' && '-Prerelease' || '' }}
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "codesign.pfx"), (Join-Path $env:RUNNER_TEMP "azure-signing.json")
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist-release/win
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (AppImage, deb, rpm)
    needs: [prepare, frontend, gate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            channel: linux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            channel: linux-arm64
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release-${{ matrix.arch }}
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev libhidapi-dev \
            libdbus-1-dev libssl-dev rpm gnupg
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - run: cargo build --release --locked -p ctrlmate-daemon -p ctrlmate-agent -p ctrlmate-desktop
      - name: Previous release (for AppImage delta)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-release/linux
          vpk download github --repoUrl "$REPO_URL" --channel "${{ matrix.channel }}" \
            --outputDir dist-release/linux --token "$GITHUB_TOKEN" \
            || echo "::warning::no previous ${{ matrix.channel }} release found, producing a full package only"
      - name: Build packages
        run: packaging/linux/pack-linux.sh --arch ${{ matrix.arch }} --formats deb,rpm,appimage
      - uses: sigstore/cosign-installer@v4.1.4
      - name: Sign packages (cosign keyless; GPG when a key is configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd dist-release/linux
          for f in *.deb *.rpm *.AppImage; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            for f in *.deb *.rpm *.AppImage; do
              [ -e "$f" ] || continue
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$f"
            done
          else
            echo "::warning::GPG_PRIVATE_KEY not set: no .asc signatures (cosign bundles are still produced)."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist-release/linux
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release
          cp artifacts/dist-windows/* release/
          cp artifacts/dist-linux-x86_64/* release/
          cp artifacts/dist-linux-aarch64/* release/
          # Home Assistant integration (Marketplace, HACS or manual install)
          (cd custom_components/ctrlmate && zip -r -X "../../release/ctrlmate-homeassistant-${VERSION}.zip" . -x '*__pycache__*')
          cp artifacts/release-notes/release-notes.md release-notes.md
          # Velopack feeds, installers and packages first; checksums over everything that ships.
          (cd release && sha256sum -- * | grep -v 'SHA256SUMS' > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.exe
            release/*.nupkg
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.zip
            release/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" release/* \
            --title "Ctrlmate ${TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag "${flags[@]}"
