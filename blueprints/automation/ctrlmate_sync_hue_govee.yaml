blueprint:
  name: Ctrlmate - Sync room lighting (Philips Hue / Govee) with PC
  author: Ctrlmate
  description: >-
    Mirrors a room light or light group (Philips Hue, Govee, ...) onto Ctrlmate PC
    lights: on/off, brightness, colour temperature (Kelvin, clamped to 2000-6500 K)
    or RGB colour, with a smooth transition.


    Blueprints are not installed by the Marketplace (or HACS). Copy this file to
    `config/blueprints/automation/ctrlmate/` (or import it from its raw GitHub URL
    in Settings > Automations & Scenes > Blueprints), then create an automation
    from it.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    source_light:
      name: Source light or group
      description: The Hue / Govee / room light that drives the PC lighting.
      selector:
        entity:
          domain: light
    target_pc_lights:
      name: Ctrlmate PC lights
      description: The master light and/or zones of the PC to keep in sync.
      selector:
        target:
          entity:
            - integration: ctrlmate
              domain: light
    transition_seconds:
      name: Transition duration
      default: 0.6
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: s

mode: restart

variables:
  source_light: !input source_light
  transition_seconds: !input transition_seconds

triggers:
  - trigger: state
    entity_id: !input source_light

actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input source_light
            state: "off"
        sequence:
          - action: light.turn_off
            target: !input target_pc_lights
            data:
              transition: "{{ transition_seconds }}"
      - conditions:
          - condition: state
            entity_id: !input source_light
            state: "on"
        sequence:
          - variables:
              src_mode: "{{ state_attr(source_light, 'color_mode') }}"
              src_brightness: >-
                {{ state_attr(source_light, 'brightness') | default(204, true) | int }}
              src_kelvin: "{{ state_attr(source_light, 'color_temp_kelvin') }}"
              src_rgb: "{{ state_attr(source_light, 'rgb_color') }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ src_mode == 'color_temp' and src_kelvin is not none }}
                sequence:
                  - action: light.turn_on
                    target: !input target_pc_lights
                    data:
                      brightness: "{{ src_brightness }}"
                      color_temp_kelvin: >-
                        {{ [2000, [6500, src_kelvin | int] | min] | max }}
                      transition: "{{ transition_seconds }}"
              - conditions:
                  - condition: template
                    value_template: "{{ src_rgb is not none }}"
                sequence:
                  - action: light.turn_on
                    target: !input target_pc_lights
                    data:
                      brightness: "{{ src_brightness }}"
                      rgb_color: "{{ src_rgb }}"
                      transition: "{{ transition_seconds }}"
            default:
              - action: light.turn_on
                target: !input target_pc_lights
                data:
                  brightness: "{{ src_brightness }}"
                  transition: "{{ transition_seconds }}"
