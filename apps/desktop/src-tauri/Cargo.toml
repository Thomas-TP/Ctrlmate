[package]
name = "ctrlmate-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ctrlmate desktop UI (Tauri v2). Talks to ctrlmated through Rust commands only."

[lib]
name = "ctrlmate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# The only workspace crate the desktop app depends on (architecture contract section 1).
ctrlmate-protocol = { path = "../../../crates/ctrlmate-protocol" }
directories.workspace = true
futures-util.workspace = true
# Loopback HTTP only: no TLS stack, no proxy.
reqwest = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tracing.workspace = true
velopack = "1.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
