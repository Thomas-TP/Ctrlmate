[package]
name = "ctrlmate-hal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Ctrlmate hardware layer: sensors, cooling runtime, lighting hub, session module, OS updates"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ctrlmate-cooling = { path = "../ctrlmate-cooling" }
ctrlmate-protocol = { path = "../ctrlmate-protocol" }
ctrlmate-rgb = { path = "../ctrlmate-rgb" }
hidapi.workspace = true
nvml-wrapper.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[lints]
workspace = true
